name: CI

on:
  pull_request:
  push:
    branches:
      - 'stack/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate content
        run: npm run content:validate --if-present

      - name: Validate assets
        run: npm run assets:check --if-present

      - name: Unit tests & coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          VITE_E2E: '1'
          VITE_DEBUG: '1'

      - name: Bundle size report & main-chunk check
        run: |
          echo "### Dist JS bundle sizes" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Raw (KB) | Gzip (KB) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: | ---: |" >> "$GITHUB_STEP_SUMMARY"
          for f in dist/assets/*.js; do
            raw=$(wc -c < "$f" | awk '{printf "%.1f", $1/1024}')
            gz=$(gzip -c "$f" | wc -c | awk '{printf "%.1f", $1/1024}')
            echo "| \`$(basename "$f")\` | $raw | $gz |" >> "$GITHUB_STEP_SUMMARY"
          done
          node scripts/check-main-bundle.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          VITE_E2E: '1'
          VITE_DEBUG: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
