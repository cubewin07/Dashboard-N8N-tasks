name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'stack/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate content
        run: npm run content:validate --if-present

      - name: Validate wardrobe catalogue
        run: npm run catalog:validate --if-present

      - name: Validate assets
        run: npm run assets:check --if-present

      - name: Unit tests & coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          VITE_E2E: '1'
          VITE_DEBUG: '1'

      - name: Bundle budgets (performance.md §2)
        run: |
          node scripts/check-main-bundle.mjs
          npm run size:budget

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          VITE_E2E: '1'
          VITE_DEBUG: '1'

      - name: Performance check (software GL thresholds)
        run: npm run perf:check

      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: perf-report.json
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # P11-T09 / R5: the app without the simulator. @/adapters/sim is aliased to the
  # NullFeed stub; the smoke and no-sim specs must pass and no sim code may ship.
  no-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FEED: none
      VITE_E2E: '1'
      VITE_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke without the simulator
        run: npx playwright test e2e/smoke.spec.ts e2e/no-sim.spec.ts

      - name: No simulator code in the build
        run: node scripts/check-sim-removable.mjs --dist

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-no-sim
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (database, auth, realtime, rest)
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,storage-api,mailpit,postgres-meta

      - name: pgTAP RLS and RPC tests
        run: supabase test db

      - name: Seed SQL is in sync with src/content
        run: node scripts/seed-sql.mjs --check
